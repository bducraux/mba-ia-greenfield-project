services:
  nestjs-api:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=streamtube
      - POSTGRES_PASSWORD=streamtube
      - POSTGRES_DB=streamtube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["/docker/seaweedfs/entrypoint.sh"]
    ports:
      - "8333:8333"
    volumes:
      - ./docker/seaweedfs:/docker/seaweedfs:ro
    environment:
      - STORAGE_ADMIN_ACCESS_KEY=${STORAGE_ADMIN_ACCESS_KEY}
      - STORAGE_ADMIN_SECRET_KEY=${STORAGE_ADMIN_SECRET_KEY}
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY}
      - STORAGE_BUCKET=${STORAGE_BUCKET}
      - STORAGE_THUMBNAILS_BUCKET=${STORAGE_THUMBNAILS_BUCKET}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12

  storage-init:
    image: amazon/aws-cli:2.37.9
    entrypoint: ["/bin/sh", "/docker/storage-init/init.sh"]
    volumes:
      - ./docker/storage-init:/docker/storage-init:ro
    env_file: .env
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"
